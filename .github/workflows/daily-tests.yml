name: Daily Tests

on:
  schedule:
    - cron: "0 7 * * *"
  # Run around midnight Pacific time.
  # GitHub runs crons on UTC time.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The build steps live in check.yml so there is only one copy to maintain.
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
