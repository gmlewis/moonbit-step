name: check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # daily-tests.yml calls this workflow on its daily schedule, so the build
  # steps are maintained in exactly one place.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: cache MoonBit toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
            .mooncakes
          key: ${{ runner.os }}-moon-${{ hashFiles('moon.mod') }}
          restore-keys: |
            ${{ runner.os }}-moon-

      - name: install-ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          /bin/bash -c "$(curl -fsSL https://cli.moonbitlang.com/install/unix.sh)"
          echo "/home/runner/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: |
          moon test

      - name: format check
        run: moon fmt --check
