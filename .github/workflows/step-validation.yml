name: STEP validation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          /bin/bash -c "$(curl -fsSL https://cli.moonbitlang.com/install/unix.sh)"
          echo "/home/runner/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: validator self-test
        run: python3 scripts/validate_step_test.py

      - name: validate generated STEP files (syntax and topology)
        run: python3 scripts/manage_examples.py all --validate --no-mesh

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          /bin/bash -c "$(curl -fsSL https://cli.moonbitlang.com/install/unix.sh)"
          echo "/home/runner/.moon/bin" >> $GITHUB_PATH

      - name: install OpenCASCADE
        run: |
          sudo apt-get update
          sudo apt-get install -y occt-draw
          sudo apt-get install -y libocct-draw-dev || true
          command -v occt-draw || command -v DRAWEXE

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: validator self-test
        run: python3 scripts/validate_step_test.py

      - name: validate generated STEP files (including tessellation)
        run: python3 scripts/manage_examples.py all --validate
